<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Insegne In Corso</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#e8e6e0; --surface:#f0ede8; --surface2:#e2dfd9; --surface3:#d8d4ce;
  --border:#c8c4be; --border2:#b0aca6;
  --accent:#2d8c5a; --accent-dim:rgba(45,140,90,0.10);
  --text:#2a2825; --muted:#8a8680; --muted2:#6a6662;
  --red:#c0392b; --orange:#c67c2a; --blue:#2a6cb0;
  --mono:'DM Mono',monospace; --sans:'DM Sans',sans-serif;
  --r:8px; --shadow:0 1px 4px rgba(0,0,0,0.10);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:var(--sans);background:var(--bg);color:var(--text);font-size:14px;min-height:100vh;padding-bottom:30px;}
.header{display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:52px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;box-shadow:var(--shadow);}
.logo{font-family:var(--mono);font-size:11px;color:var(--accent);letter-spacing:.15em;font-weight:500;}
.logo span{color:var(--muted);}
.header-right{display:flex;align-items:center;gap:8px;}
.badge-pub{font-family:var(--mono);font-size:9px;background:rgba(45,140,90,.1);color:var(--accent);border:1px solid rgba(45,140,90,.2);padding:3px 8px;border-radius:3px;}
.btn-sync{font-family:var(--mono);font-size:10px;padding:6px 12px;background:transparent;border:1px solid var(--border);border-radius:6px;color:var(--muted2);display:flex;align-items:center;gap:5px;cursor:pointer;}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex-shrink:0;}
.sync-dot.syncing{background:var(--orange);animation:pulse 1s infinite;}
.sync-dot.error{background:var(--red);}
.stats-bar{display:flex;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--border);}
.stat{flex:1;text-align:center;}
.stat-val{font-family:var(--mono);font-size:20px;color:var(--accent);font-weight:500;}
.stat-lbl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-top:1px;}
.stat+.stat{border-left:1px solid var(--border);}
.filters-wrap{padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:52px;z-index:99;}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch;}
.filters::-webkit-scrollbar{display:none;}
.fbtn{font-family:var(--mono);font-size:10px;padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:var(--surface2);color:var(--muted);white-space:nowrap;cursor:pointer;flex-shrink:0;}
.fbtn.active{border-color:var(--accent);color:var(--accent);background:var(--accent-dim);}
.year-wrap{padding:10px 16px 0;display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
.year-wrap::-webkit-scrollbar{display:none;}
.ybtn{font-family:var(--mono);font-size:10px;padding:4px 12px;border-radius:4px;border:1px solid var(--border);background:var(--surface);color:var(--muted);white-space:nowrap;cursor:pointer;flex-shrink:0;}
.ybtn.active{border-color:var(--accent);color:var(--accent);background:var(--accent-dim);}
.cards{padding:12px 16px;display:flex;flex-direction:column;gap:10px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px;}
.card-name{font-weight:700;font-size:15px;line-height:1.2;}
.card-fiera{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:3px;}
.badge{font-family:var(--mono);font-size:9px;padding:3px 8px;border-radius:3px;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;font-weight:500;flex-shrink:0;margin-left:8px;}
.b-green{background:rgba(45,140,90,.12);color:var(--accent);border:1px solid rgba(45,140,90,.25);}
.b-orange{background:rgba(198,124,42,.12);color:var(--orange);border:1px solid rgba(198,124,42,.25);}
.b-gray{background:rgba(100,100,100,.10);color:#666;border:1px solid rgba(100,100,100,.20);}
.b-blue{background:rgba(42,108,176,.12);color:var(--blue);border:1px solid rgba(42,108,176,.25);}
.card-info{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:8px;}
.info-item{display:flex;flex-direction:column;gap:1px;}
.info-lbl{font-family:var(--mono);font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;}
.info-val{font-size:12px;color:var(--muted2);}
.empty{text-align:center;padding:40px 20px;font-family:var(--mono);font-size:11px;color:var(--muted);}
.loading{text-align:center;padding:40px 20px;font-family:var(--mono);font-size:11px;color:var(--muted);animation:pulse 1s infinite;}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:#fff;font-family:var(--mono);font-size:11px;padding:9px 20px;border-radius:6px;opacity:0;transition:all .3s;z-index:9999;white-space:nowrap;pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.error{background:var(--red);}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
</style>
</head>
<body>
<div class="header">
  <div class="logo">INSEGNE <span>IN CORSO</span></div>
  <div class="header-right">
    <div class="badge-pub">BACHECA</div>
    <button class="btn-sync" onclick="loadData()">
      <div class="sync-dot" id="sync-dot"></div>
      <span id="sync-lbl">Sync</span>
    </button>
  </div>
</div>
<div class="stats-bar">
  <div class="stat"><div class="stat-val" id="s-tot">—</div><div class="stat-lbl">Totale</div></div>
  <div class="stat"><div class="stat-val" id="s-prod">—</div><div class="stat-lbl">Produzione</div></div>
  <div class="stat"><div class="stat-val" id="s-prev">—</div><div class="stat-lbl">Preventivo</div></div>
</div>
<div class="filters-wrap">
  <div class="filters">
    <button class="fbtn active" onclick="setFilter('tutti',this)">Tutti</button>
    <button class="fbtn" onclick="setFilter('nonconfermato',this)">Non confermato</button>
    <button class="fbtn" onclick="setFilter('preventivo',this)">Preventivo</button>
    <button class="fbtn" onclick="setFilter('produzione',this)">Produzione</button>
    <button class="fbtn" onclick="setFilter('consegnato',this)">Consegnato</button>
  </div>
</div>
<div class="year-wrap" id="year-bar"></div>
<div class="cards" id="cards"><div class="loading">Caricamento...</div></div>
<div class="toast" id="toast"></div>

<script>
const SHEET_ID = '1Ol-iDcrcZyaFhi2fAWoniUkQuK_DJ0g7T4pD5-JaMjo';
const SHEET_NAME = 'Progetti';
const URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(SHEET_NAME)}`;

const STATI = {
  nonconfermato:{label:'Non confermato',cls:'b-gray'},
  preventivo:{label:'Preventivo',cls:'b-blue'},
  produzione:{label:'Produzione',cls:'b-orange'},
  consegnato:{label:'Consegnato',cls:'b-green'}
};

let projects=[], curFilter='tutti', curYear='tutti';

window.addEventListener('load', loadData);

function setSyncing(s,msg){
  document.getElementById('sync-dot').className='sync-dot'+(s!=='ok'?' '+s:'');
  document.getElementById('sync-lbl').textContent=msg||'Sync';
}

async function loadData(){
  setSyncing('syncing','...');
  try {
    const res = await fetch(URL+'&'+Date.now());
    const text = await res.text();
    const json = JSON.parse(text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/)[1]);
    const cols = json.table.cols.map(c => c.label);
    projects = json.table.rows
      .filter(r => r && r.c && r.c[0] && r.c[0].v)
      .map(r => {
        const get = (label) => {
          const i = cols.indexOf(label);
          if (i < 0) return '';
          const cell = r.c[i];
          if (!cell || cell.v === null || cell.v === undefined) return '';
          return cell.f || String(cell.v);
        };
        return {
          cliente: get('Cliente'),
          fiera: get('Fiera'),
          account: get('Account'),
          anno: get('Anno'),
          stato: get('Stato'),
          consegna: get('Consegna') || get('DataConsegna'),
          fornitore: get('Fornitore'),
        };
      });
    setSyncing('ok','Sync');
    showToast('✓ '+projects.length+' progetti');
    renderAll();
  } catch(e) {
    setSyncing('error','Errore');
    document.getElementById('cards').innerHTML='<div class="empty">Errore caricamento dati</div>';
  }
}

function fp(){
  return projects.filter(p=>
    (curYear==='tutti'||String(p.anno)===curYear) &&
    (curFilter==='tutti'||p.stato===curFilter)
  );
}

function renderAll(){updateStats();buildYearBar();renderCards();}

function updateStats(){
  document.getElementById('s-tot').textContent=projects.length;
  document.getElementById('s-prod').textContent=projects.filter(p=>p.stato==='produzione').length;
  document.getElementById('s-prev').textContent=projects.filter(p=>p.stato==='preventivo').length;
}

function buildYearBar(){
  const years=[...new Set(projects.map(p=>String(p.anno)))].filter(Boolean).sort();
  const mk=(y,lbl)=>`<button class="ybtn${curYear===y?' active':''}" onclick="setYear('${y}',this)">${lbl}</button>`;
  document.getElementById('year-bar').innerHTML=mk('tutti','Tutti')+years.map(y=>mk(y,y)).join('');
}

function setYear(y,btn){
  curYear=y;
  document.querySelectorAll('.ybtn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderCards();
}

function setFilter(f,btn){
  curFilter=f;
  document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderCards();
}

function renderCards(){
  const list=fp();
  const el=document.getElementById('cards');
  if(!list.length){el.innerHTML='<div class="empty">Nessun progetto</div>';return;}
  el.innerHTML=list.map(p=>{
    const s=STATI[p.stato]||STATI.preventivo;
    return `<div class="card">
      <div class="card-top">
        <div><div class="card-name">${p.cliente||'—'}</div><div class="card-fiera">${p.fiera||'—'}</div></div>
        <span class="badge ${s.cls}">${s.label}</span>
      </div>
      <div class="card-info">
        <div class="info-item"><div class="info-lbl">Account</div><div class="info-val">${p.account||'—'}</div></div>
        <div class="info-item"><div class="info-lbl">Consegna</div><div class="info-val">${p.consegna||'—'}</div></div>
        <div class="info-item"><div class="info-lbl">Fornitore</div><div class="info-val">${p.fornitore||'—'}</div></div>
      </div>
    </div>`;
  }).join('');
}

function showToast(msg,type){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.className='toast'+(type?' '+type:'');
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}
</script>
</body>
</html>
